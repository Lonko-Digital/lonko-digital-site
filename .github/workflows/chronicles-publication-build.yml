name: Chronicles publication build

on:
  push:
    branches:
      - "chronicles/publish/**"
    paths:
      - "chronicles/content/**"
      - "scripts/chronicles_lib/**"
      - "scripts/build_chronicles.py"
      - "scripts/test_chronicles_*.py"
      - ".github/workflows/chronicles-publication-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chronicles-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chronicles dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-chronicles-bridge.txt

      - name: Build Chronicles
        run: python scripts/build_chronicles.py

      - name: Validate publication contract
        run: python scripts/test_chronicles_publishing_contract.py

      - name: Validate asset paths
        run: python scripts/test_chronicles_asset_paths.py

      - name: Validate hero and OG dimensions
        run: python scripts/test_chronicles_hero_og_dims.py

      - name: Validate GA4 foundation
        run: python scripts/test_chronicles_ga4_foundation.py

      - name: Validate production contract v2
        run: python scripts/test_chronicles_production_contract_v2.py

      - name: Public safety audit
        run: |
          if [ -f scripts/audit_public_site.py ]; then
            python scripts/audit_public_site.py
          elif [ -f scripts/public_safety_audit.py ]; then
            python scripts/public_safety_audit.py
          else
            echo "No dedicated public safety audit script found; build validations completed."
          fi

      - name: Commit generated publication outputs
        run: |
          set -euo pipefail
          git config user.name "lonko-chronicles-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chronicles/ sitemap.xml sitemap-pages.xml sitemap-chronicles.xml robots.txt || true
          if git diff --cached --quiet; then
            echo "Generated outputs already in sync."
            exit 0
          fi
          git commit -m "Build Chronicles publication outputs"
          git push origin HEAD:${{ github.ref_name }}
