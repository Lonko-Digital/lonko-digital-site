name: Chronicles Drive ingest

# Pulls Drive (or local) packages, validates against v4, stages content, opens a PR.
# Never pushes to main. Alex approve/merge is the publication authorization event.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chronicles-drive-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-chronicles-bridge.txt

      - name: Verify bridge Python dependencies
        run: python scripts/test_chronicles_bridge_deps.py

      - name: Sync Drive inbox + ingest (validate → stage → build → Drive archive)
        id: ingest
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_QUARANTINE_FOLDER_ID: ${{ secrets.DRIVE_QUARANTINE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p bridge/inbox bridge/processed bridge/quarantine
          ARGS=(--inbox bridge/inbox --processed bridge/processed --quarantine bridge/quarantine --audit chronicles/ingest-audit.jsonl)
          if [ -n "${DRIVE_SERVICE_ACCOUNT_JSON:-}" ] && [ -n "${DRIVE_INBOX_FOLDER_ID:-}" ]; then
            echo "Drive configured — syncing Inbox then ingesting."
            python scripts/run_chronicles_ingest.py --sync-drive --archive-drive "${ARGS[@]}"
          else
            echo "Drive secrets not set — ingesting local bridge/inbox only (if any)."
            python scripts/run_chronicles_ingest.py "${ARGS[@]}"
          fi | tee /tmp/ingest-result.json

      - name: Detect changes for PR
        id: diff
        run: |
          if git status --porcelain | grep -E 'chronicles/|sitemap|robots\.txt' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open ingest PR (never push main)
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SLUG=$(python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("/tmp/ingest-result.json").read_text(encoding="utf-8")
          start = raw.find("{")
          end = raw.rfind("}") + 1
          data = json.loads(raw[start:end]) if start >= 0 else {}
          staged = [r for r in data.get("results", []) if r.get("outcome") == "staged"]
          print(staged[0]["slug"] if staged else "ingest")
          PY
          )
          SHORT=$(git rev-parse --short HEAD)
          BRANCH="chronicles/ingest/${SLUG}-${SHORT}-$GITHUB_RUN_ID"
          git config user.name "lonko-chronicles-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add chronicles/ sitemap.xml sitemap-pages.xml sitemap-chronicles.xml robots.txt || true
          git status
          git commit -m "Chronicles ingest: ${SLUG}

          Staged by Drive publishing bridge. Production unchanged until this PR is approved and merged.
          "
          git push -u origin HEAD
          gh pr create \
            --base main \
            --title "Chronicles ingest: ${SLUG}" \
            --body "$(cat <<EOF
          ## Chronicles Drive ingest

          Automated staging from the editorial Drive inbox.

          **Publication requires Alex approval/merge.** This workflow never pushes to \`main\`.

          ### Checklist
          - [ ] Placement / Featured intentional
          - [ ] Sources verified
          - [ ] Imagery / social raster assets OK
          - [ ] schema_type independent of content_type

          EOF
          )"
