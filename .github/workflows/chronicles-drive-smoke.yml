name: Chronicles Drive cloud smoke

# Synthetic cloud smoke: ensure package in Drive Inbox → ingest → PR → Processed.
# Never merges. Close the PR without merging after verification.
#
# Upload constraint: Google service accounts have no My Drive quota. Prefer a
# Shared Drive for Lonko Chronicles/*. If Inbox is My Drive, place the package
# folder manually once (from bridge/fixtures/cloud-smoke/) then re-run.

on:
  workflow_dispatch:
    inputs:
      assume_uploaded:
        description: "Package already in Drive Inbox (skip SA upload attempt)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chronicles-drive-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6" "markdown>=3.5" "google-auth>=2" "google-api-python-client>=2"

      - name: Require Drive secrets
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_QUARANTINE_FOLDER_ID: ${{ secrets.DRIVE_QUARANTINE_FOLDER_ID }}
        run: |
          set -euo pipefail
          for v in DRIVE_SERVICE_ACCOUNT_JSON DRIVE_INBOX_FOLDER_ID DRIVE_PROCESSED_FOLDER_ID DRIVE_QUARANTINE_FOLDER_ID; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v" >&2
              exit 1
            fi
          done
          echo "All four Drive secrets are present."

      - name: Diagnose Inbox + ensure smoke package present
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_QUARANTINE_FOLDER_ID: ${{ secrets.DRIVE_QUARANTINE_FOLDER_ID }}
          ASSUME_UPLOADED: ${{ inputs.assume_uploaded }}
        run: |
          set -euo pipefail
          python scripts/build_bridge_smoke_package.py
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from chronicles_bridge.drive import (
              _service,
              list_inbox_folders,
              restore_package_to_inbox,
              upload_package_to_inbox,
          )

          SLUG = "bridge-cloud-smoke-synthetic-signal"
          pkg = Path("bridge/smoke-package") / SLUG
          if not pkg.is_dir():
              pkg = Path("bridge/fixtures/cloud-smoke") / SLUG
          service = _service()
          inbox_id = os.environ["DRIVE_INBOX_FOLDER_ID"]
          meta = service.files().get(
              fileId=inbox_id,
              fields="id,name,driveId,owners,mimeType",
              supportsAllDrives=True,
          ).execute()
          print("Inbox meta:", json.dumps(meta, indent=2))
          existing = {f["name"]: f for f in list_inbox_folders(service)}
          print("Inbox children:", sorted(existing))
          assume = os.environ.get("ASSUME_UPLOADED", "false").lower() in {"1", "true", "yes"}
          if SLUG in existing:
              print(f"Package already in Inbox: {SLUG}")
          elif assume:
              # Re-test path: restore from Processed/Quarantine (no human re-upload).
              info = restore_package_to_inbox(SLUG)
              print("Restored for re-test:", json.dumps(info, indent=2))
          elif meta.get("driveId"):
              print("Shared Drive detected — uploading via service account.")
              info = upload_package_to_inbox(pkg)
              print(json.dumps(info, indent=2))
          else:
              try:
                  info = upload_package_to_inbox(pkg)
                  print(json.dumps(info, indent=2))
              except Exception as exc:
                  print("SA upload failed (expected on My Drive):", exc)
                  # Last chance: restore prior smoke package from Processed
                  try:
                      info = restore_package_to_inbox(SLUG)
                      print("Restored from archive:", json.dumps(info, indent=2))
                  except Exception:
                      raise SystemExit(
                          "SMOKE BLOCKED: package not in Inbox and SA cannot upload to My Drive.\n"
                          "Upload the ZIP package to Inbox, or ensure it still exists in Processed."
                      ) from exc
          PY

      - name: Upload smoke package artifact (for manual Inbox drop if needed)
        uses: actions/upload-artifact@v4
        with:
          name: bridge-cloud-smoke-synthetic-signal
          path: bridge/smoke-package/bridge-cloud-smoke-synthetic-signal

      - name: Ingest from Drive (validate → stage → build → archive)
        id: ingest
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_PROCESSED_FOLDER_ID: ${{ secrets.DRIVE_PROCESSED_FOLDER_ID }}
          DRIVE_QUARANTINE_FOLDER_ID: ${{ secrets.DRIVE_QUARANTINE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p bridge/inbox bridge/processed bridge/quarantine
          python scripts/run_chronicles_ingest.py \
            --sync-drive \
            --archive-drive \
            --inbox bridge/inbox \
            --processed bridge/processed \
            --quarantine bridge/quarantine \
            --audit chronicles/ingest-audit.jsonl \
            | tee /tmp/ingest-result.json

      - name: Summarize ingest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("/tmp/ingest-result.json").read_text(encoding="utf-8")
          start, end = raw.find("{"), raw.rfind("}") + 1
          data = json.loads(raw[start:end])
          print(json.dumps(data, indent=2))
          results = data.get("results", [])
          staged = [r for r in results if r.get("outcome") == "staged"]
          if not staged:
              raise SystemExit("SMOKE FAIL: no staged result")
          archive = data.get("drive_archive", [])
          moved = [a for a in archive if a.get("action") == "moved" and a.get("to") == "processed"]
          if not moved:
              raise SystemExit(f"SMOKE FAIL: package not moved to Processed: {archive}")
          print("SMOKE CHECKS: staged=OK processed_move=OK")
          PY

      - name: Open smoke PR (do not merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SLUG="bridge-cloud-smoke-synthetic-signal"
          BRANCH="chronicles/smoke/${SLUG}-$GITHUB_RUN_ID"
          git config user.name "lonko-chronicles-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add chronicles/ sitemap.xml sitemap-pages.xml sitemap-chronicles.xml robots.txt || true
          if git diff --cached --quiet; then
            echo "No staged git changes — unexpected for smoke." >&2
            exit 1
          fi
          git commit -m "Chronicles cloud smoke PR verify: ${SLUG}

          Synthetic automatic-PR verification. DO NOT MERGE.
          "
          git push -u origin HEAD
          # Requires: Settings → Actions → General → Workflow permissions →
          # "Allow GitHub Actions to create and approve pull requests"
          PR_URL=$(gh pr create \
            --base main \
            --title "SMOKE PR-VERIFY (do not merge): Chronicles Drive bridge" \
            --body "## Chronicles Drive automatic PR verification

          Synthetic package only. **Do not merge.**

          Confirms GitHub Actions can open the ingest PR automatically after Drive ingest.

          Close/delete after Cursor Web confirms.
          ")
          echo "Opened: $PR_URL"
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
          # Prove the PR author is github-actions bot (automatic create)
          gh pr view "$PR_URL" --json url,author,number,state,headRefName


      - name: Confirm main unchanged tip
        run: |
          git fetch origin main
          echo "origin/main=$(git rev-parse origin/main)"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)"
          echo "Production main tip differs from smoke branch (expected)."
